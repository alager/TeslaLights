<!DOCTYPE html>
<html>
<head>
    <title>Tesla Lights BLE App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <div class="topnav">
        <h1>Tesla Lights BLE App</h1>
    </div>
    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton"> Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="offButton" disabled> Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
				<button id="offButton" class="offButton" disabled>All OFF</button>
            </div>
        </div>
        <div class="card-grid">
            <div class="card">
                <h2>Knight Rider</h2>
                <button id="knightRiderButton" class="offButton" disabled>ON</button>
            </div>
			<div class="card">
                <h2>Red Flash</h2>
                <button id="redFlashButton" class="offButton" disabled>ON</button>
            </div>
			<div class="card">
                <h2>PoPo Mode</h2>
                <button id="popoModeButton" class="offButton" disabled>ON</button>
            </div>
			<div class="card">
                <h2>Yellow Flash</h2>
                <button id="yellowFlashButton" class="offButton" disabled>ON</button>
            </div>
			<div class="card">
                <h2>Red Breathing</h2>
                <button id="redBreathingButton" class="offButton" disabled>ON</button>
            </div>
        </div>
    </div>
    
</body>
<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const knightRiderButton = document.getElementById('knightRiderButton');
    const redFlashButton = document.getElementById('redFlashButton');
    const popoModeButton = document.getElementById('popoModeButton');
    const yellowFlashButton = document.getElementById('yellowFlashButton');
    const redBreathingButton = document.getElementById('redBreathingButton');
    const offButton = document.getElementById('offButton');
    const retrievedValue = document.getElementById('valueContainer');
    // const latestValueSent = document.getElementById('valueSent');
    const bleStateContainer = document.getElementById('bleState');
    const timestampContainer = document.getElementById('timestamp');

    //Define BLE Device Specs
    const deviceName =			'Tesla Lights';
    const bleService = 			'19b10000-e8f2-537e-4f6c-d104768a1214';
    const ledCharacteristic = 	'19b10002-e8f2-537e-4f6c-d104768a1214';
    // const sensorCharacteristic= '19b10001-e8f2-537e-4f6c-d104768a1214';

    //Global Variables to Handle Bluetooth
    var bleServer;
    var bleServiceFound;
    var ledCharacteristicFound;

    // Connect Button (search for BLE Devices only if BLE is available)
    connectButton.addEventListener('click', (event) => {
        if (isWebBluetoothEnabled()){
            connectToDevice();
        }
    });

    // Disconnect Button
    disconnectButton.addEventListener('click', disconnectDevice);

    // Write to the BLE LED Characteristic
	offButton.addEventListener('click', () => writeOnCharacteristic(0));
    knightRiderButton.addEventListener('click', () => writeOnCharacteristic(1));
    redFlashButton.addEventListener('click', () => writeOnCharacteristic(2));
	popoModeButton.addEventListener('click', () => writeOnCharacteristic(3));
	yellowFlashButton.addEventListener('click', () => writeOnCharacteristic(4));
	redBreathingButton.addEventListener('click', () => writeOnCharacteristic(5));
    

    // Check if BLE is available in your Browser
    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            console.log('Web Bluetooth API is not available in this browser!');
            bleStateContainer.innerHTML = "Web Bluetooth API is not available in this browser/device!";
            return false
        }
        console.log('Web Bluetooth API supported in this browser.');
        return true
    }

    // Connect to BLE Device and Enable Notifications
    function connectToDevice(){
        console.log('Initializing Bluetooth...');
        navigator.bluetooth.requestDevice({
            filters: [{name: deviceName}],
            optionalServices: [bleService]
        })
        .then(device => {
            console.log('Device Selected:', device.name);
            bleStateContainer.innerHTML = 'Connected to device ' + device.name;
            bleStateContainer.style.color = "#24af37";
            device.addEventListener('gattserverdisconnected', onDisconnected);
            return device.gatt.connect();
        })
        .then(gattServer =>{
            bleServer = gattServer;
            console.log("Connected to GATT Server");
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => {
            bleServiceFound = service;
            console.log("Service discovered:", service.uuid);
			bleServiceFound.getCharacteristic(ledCharacteristic)
			.then(characteristic => {
				ledCharacteristicFound = characteristic;
				console.log("Found the LED characteristic: ", characteristic.uuid);
			})
        })
        .then(characteristic => {
			enableButtons();
        })
        .catch(error => {
            console.log('Error: ', error);
        })
    }

    function onDisconnected(event){
        // console.log('Device Disconnected:', event.target.device.name);
		console.log('Device Disconnected:', event.target.name);
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";

		ledCharacteristicFound = null;
		bleServiceFound = null;

		// if (ledCharacteristicFound) {
		// 	ledCharacteristicFound.stopNotifications()
		// 	.then(() => {
		// 		console.log("Notifications Stopped");
		// 		return bleServer.disconnect();
		// 	});
		// }
        // connectToDevice();
    }

    function handleCharacteristicChange(event){
        const newValueReceived = new TextDecoder().decode(event.target.value);
        console.log("Characteristic value changed: ", newValueReceived);
        retrievedValue.innerHTML = newValueReceived;
        // timestampContainer.innerHTML = getDateTime();
    }

    function writeOnCharacteristic(value){
        if (bleServer && bleServer.connected) {
            bleServiceFound.getCharacteristic(ledCharacteristic)
            .then(characteristic => {
                console.log("Found the LED characteristic: ", characteristic.uuid);
                const data = new Uint8Array([value]);
                return characteristic.writeValue(data);
            })
            .then(() => {
                console.log("Value written to LEDcharacteristic:", value);
				setButtonClicked(value);
            })
            .catch(error => {
                console.error("Error writing to the LED characteristic: ", error);
            });
        } else {
            console.error ("Bluetooth is not connected. Cannot write to characteristic.")
            window.alert("Bluetooth is not connected. Cannot write to characteristic. \n Connect to BLE first!")
        }
    }

    function disconnectDevice() {
        console.log("Disconnect Device.");
        if (bleServer && bleServer.connected) {
            if (ledCharacteristicFound) {
                ledCharacteristicFound.stopNotifications()
                    .then(() => {
                        console.log("Notifications Stopped");
                        return bleServer.disconnect();
                    })
                    .then(() => {
                        console.log("Device Disconnected");
                        bleStateContainer.innerHTML = "Device Disconnected";
                        bleStateContainer.style.color = "#d13a30";
						disableButtons();
                    })
                    .catch(error => {
                        console.log("An error occurred:", error);
                    });
            } else {
                console.log("No characteristic found to disconnect.");
            }
        } else {
            // Throw an error if Bluetooth is not connected
            console.error("Bluetooth is not connected.");
            window.alert("Bluetooth is not connected.")
        }
    }

    function enableButtons() {
		// enable the buttons after successful connection and characteristic discovery
		knightRiderButton.disabled = false;
		redFlashButton.disabled = false;
		popoModeButton.disabled = false;
		yellowFlashButton.disabled = false;
		redBreathingButton.disabled = false;
		offButton.disabled = false;
		disconnectButton.disabled = false;

		setButtonsActiveColor();
	}

	function setButtonsActiveColor() {
		// update the button class to indicate they are active
		knightRiderButton.classList.remove('offButton');
		knightRiderButton.classList.remove('clickedButton');
		knightRiderButton.classList.add('onButton');
		redFlashButton.classList.remove('clickedButton');
		redFlashButton.classList.remove('offButton');
		redFlashButton.classList.add('onButton');
		popoModeButton.classList.remove('clickedButton');
		popoModeButton.classList.remove('offButton');
		popoModeButton.classList.add('onButton');
		yellowFlashButton.classList.remove('clickedButton');
		yellowFlashButton.classList.remove('offButton');
		yellowFlashButton.classList.add('onButton');
		redBreathingButton.classList.remove('clickedButton');
		redBreathingButton.classList.remove('offButton');
		redBreathingButton.classList.add('onButton');
		offButton.classList.remove('clickedButton');
		offButton.classList.remove('offButton');
		offButton.classList.add('onButton');
		disconnectButton.classList.remove('offButton');
		disconnectButton.classList.add('disconnectButton');
	}

	function setButtonClicked(value) {
		// reset all buttons to active color
		setButtonsActiveColor();

		// set the clicked button to a different color
		switch(value) {
			case 0:
				offButton.classList.add('clickedButton');
				break;
			case 1:
				knightRiderButton.classList.add('clickedButton');
				break;
			case 2:
				redFlashButton.classList.add('clickedButton');
				break;
			case 3:
				popoModeButton.classList.add('clickedButton');
				break;
			case 4:
				yellowFlashButton.classList.add('clickedButton');
				break;
			case 5:
				redBreathingButton.classList.add('clickedButton');
				break;
			default:
				break;
		}
	}

	function disableButtons() {
		// disable the buttons after disconnection
		knightRiderButton.disabled = true;
		redFlashButton.disabled = true;
		popoModeButton.disabled = true;
		yellowFlashButton.disabled = true;
		redBreathingButton.disabled = true;
		offButton.disabled = true;
		disconnectButton.disabled = true;

		// update the button class to indicate they are inactive
		knightRiderButton.classList.remove('onButton');
		knightRiderButton.classList.add('offButton');
		redFlashButton.classList.remove('onButton');
		redFlashButton.classList.add('offButton');
		popoModeButton.classList.remove('onButton');
		popoModeButton.classList.add('offButton');
		yellowFlashButton.classList.remove('onButton');
		yellowFlashButton.classList.add('offButton');
		redBreathingButton.classList.remove('onButton');
		redBreathingButton.classList.add('offButton');
		offButton.classList.remove('onButton');
		offButton.classList.add('offButton');
		disconnectButton.classList.remove('disconnectButton');
		disconnectButton.classList.add('offButton');
	}


</script>

</html>
